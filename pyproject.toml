[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "holistic-motion"
version = "0.1.0"
description = "Robot models, kinematics, manifolds, and trajectory generation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "trimesh>=4.0", "viser>=1.0"]
retargeting = ["pin>=3.8,<5"]
docs = [
    "Sphinx>=8,<10",
    "breathe>=4.35,<5",
    "furo>=2025.7",
    "myst-parser>=4,<5",
]

[tool.scikit-build]
wheel.packages = ["python/holistic_motion"]
cmake.build-type = "Release"
