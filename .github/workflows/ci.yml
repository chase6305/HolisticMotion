name: Build and test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: git diff --check HEAD

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install 'conan>=2.28' 'numpy>=1.23' 'pytest>=7' 'hypothesis>=6.112,<7'
      - name: Detect Conan profile
        run: conan profile detect
      - name: Build CPU, collision, and Python components
        env:
          JOBS: "2"
        run: ./scripts/build.sh --tests --no-cuda
      - name: Validate exported core package and consumer
        run: >-
          conan create . --no-remote
          -o '&:with_python=False'
          -o '&:with_tests=False'
          -o '&:with_cuda=False'
          -o '&:with_collision=False'

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install 'conan>=2.28' 'numpy>=1.23' 'pytest>=7' 'hypothesis>=6.112,<7'
      - name: Detect Conan profile
        run: conan profile detect
      - name: Build Python without CUDA or collision
        env:
          BUILD_DIR: build-core
          JOBS: "2"
        run: ./scripts/build.sh --tests --no-cuda --no-collision
      - name: Configure C++ sanitizers and Eigen assertions
        run: >-
          cmake -S . -B build-sanitizers
          -DCMAKE_TOOLCHAIN_FILE="$PWD/build-core/build/Release/generators/conan_toolchain.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DHOLISTICMOTION_BUILD_PYTHON=OFF
          -DHOLISTICMOTION_BUILD_TESTS=ON
          -DHOLISTICMOTION_ENABLE_CUDA=OFF
          -DHOLISTICMOTION_ENABLE_COLLISION=OFF
          -DHOLISTICMOTION_ENABLE_SANITIZERS=ON
      - name: Build and test with ASan and UBSan
        run: |
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers --output-on-failure --no-tests=error
